[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "cno-visualizer"
version = "0.1.0"
description = "Interactive PyVista/VTK viewer for complex Cell Natural Orbitals"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CNO-Visualizer contributors" }]
keywords = ["physics", "dft", "orbitals", "visualization", "pyvista", "vtk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyvista>=0.43,<1.0",
    "vtk>=9.2",
    "matplotlib>=3.7",
    "colorcet>=3.0",
    "ase>=3.22",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
anim = ["imageio>=2.28", "imageio-ffmpeg>=0.4"]

[project.scripts]
cno-visualizer = "cno_visualizer.cli:main"
cno-visualizer-gui = "cno_visualizer.launcher:main"
cno-anim = "cno_visualizer.animation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cno_visualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
